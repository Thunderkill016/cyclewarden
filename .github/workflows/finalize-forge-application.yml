name: Finalize Forge application slice

on:
  push:
    branches:
      - agent/atoryn-forge-application-fakes
    paths:
      - .github/workflows/finalize-forge-application.yml
  pull_request:
    branches:
      - agent/atoryn-forge-domain-foundation

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-application-fakes
          fetch-depth: 0

      - name: Mark validated tasks complete and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('specs/001-remote-agent-run/tasks.md')
          text = path.read_text(encoding='utf-8')
          for task_id in range(20, 30):
              old = f'- [ ] T{task_id:03d}'
              new = f'- [x] T{task_id:03d}'
              if old not in text:
                  raise SystemExit(f'Expected task marker not found: {old}')
              text = text.replace(old, new, 1)

          checkpoint = '**Checkpoint**: The entire domain lifecycle runs deterministically without external providers or web UI.'
          replacement = (
              checkpoint
              + ' Validation evidence: frozen pnpm install; domain typecheck, 13 tests, and build; '
              + 'application typecheck, 7 tests, and build passed on Ubuntu/Node 22 in PR #72.'
          )
          if checkpoint not in text:
              raise SystemExit('Phase 3 checkpoint not found')
          text = text.replace(checkpoint, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/finalize-forge-application.yml

      - name: Commit finalized task evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/001-remote-agent-run/tasks.md .github/workflows/finalize-forge-application.yml
          git commit -m "Mark Forge application fake lifecycle complete"
          git push origin HEAD:agent/atoryn-forge-application-fakes

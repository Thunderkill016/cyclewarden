name: Forge Vitest matcher sweep

on:
  push:
    branches:
      - agent/atoryn-forge-final-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vitest-matcher-sweep]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-final-hardening
      - name: Normalize obsolete toMatchObject type arguments
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(r"\.toMatchObject<\s*Partial<[^>]+>\s*>\s*\(", re.MULTILINE)
          for root in (Path('apps'), Path('packages')):
              for path in root.rglob('*.ts*'):
                  text = path.read_text()
                  next_text, count = pattern.subn('.toMatchObject(', text)
                  if count:
                      path.write_text(next_text)
                      changed.append((str(path), count))
          if not changed:
              raise SystemExit('No obsolete matchers found')
          for path, count in changed:
              print(f'{path}: {count}')
          PY
          ! grep -R --include='*.ts' --include='*.tsx' -nE 'toMatchObject<[[:space:]]*Partial<' apps packages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps packages
          git commit -m "test: normalize obsolete Vitest matcher generics [vitest-matcher-sweep]"
          git push origin HEAD:agent/atoryn-forge-final-hardening

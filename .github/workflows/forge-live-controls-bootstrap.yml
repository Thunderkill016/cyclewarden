name: Forge live controls verification

on:
  push:
    branches:
      - agent/atoryn-forge-live-controls
    paths-ignore:
      - .github/forge-live-controls-result.txt

permissions:
  contents: write

jobs:
  verify-web-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
      BETTER_AUTH_URL: http://127.0.0.1:3000
      AUTH_ADAPTER: better-auth
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run targeted verification and write report
        id: verify
        shell: bash
        run: |
          set +e
          : > /tmp/forge-live-controls.log
          overall=0

          run_check() {
            label="$1"
            shift
            echo "## ${label}" | tee -a /tmp/forge-live-controls.log
            "$@" 2>&1 | tee -a /tmp/forge-live-controls.log
            status=${PIPESTATUS[0]}
            echo "STATUS=${status}" | tee -a /tmp/forge-live-controls.log
            echo | tee -a /tmp/forge-live-controls.log
            if [ "${status}" -ne 0 ]; then overall=${status}; fi
          }

          run_check "Frozen install" pnpm install --frozen-lockfile
          run_check "Forge domain build" pnpm --filter @cyclewarden/forge-domain build
          run_check "Web typecheck" pnpm --filter @cyclewarden/web typecheck
          run_check "Replay and approval tests" pnpm --filter @cyclewarden/web exec vitest run src/lib/forge/run-event-projection.test.ts
          run_check "Web production build" pnpm --filter @cyclewarden/web build

          {
            echo "# Forge live-controls verification"
            echo
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
            echo "OVERALL_STATUS=${overall}"
            echo
            cat /tmp/forge-live-controls.log
          } > .github/forge-live-controls-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/forge-live-controls-result.txt
          git commit -m "Record Forge live-controls verification" || true
          git push
          exit "${overall}"

name: Forge live controls verification

on:
  push:
    branches:
      - agent/atoryn-forge-live-controls
    paths-ignore:
      - .github/forge-live-controls-result.txt

permissions:
  contents: write

jobs:
  verify-cross-context-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyclewarden
          POSTGRES_PASSWORD: cyclewarden
          POSTGRES_DB: cyclewarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclewarden -d cyclewarden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      DATABASE_URL: postgresql://cyclewarden:cyclewarden@127.0.0.1:5432/cyclewarden
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
      BETTER_AUTH_URL: http://127.0.0.1:3000
      AUTH_ADAPTER: better-auth
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_HOST: 127.0.0.1
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run one cross-context acceptance flow and write report
        shell: bash
        run: |
          set +e
          : > /tmp/forge-live-controls.log
          overall=0

          run_check() {
            label="$1"
            shift
            echo "## ${label}" | tee -a /tmp/forge-live-controls.log
            "$@" 2>&1 | tee -a /tmp/forge-live-controls.log
            status=${PIPESTATUS[0]}
            echo "STATUS=${status}" | tee -a /tmp/forge-live-controls.log
            echo | tee -a /tmp/forge-live-controls.log
            if [ "${status}" -ne 0 ]; then overall=${status}; fi
          }

          run_check "Frozen install" pnpm install --frozen-lockfile
          run_check "Database migrations" pnpm db:migrate
          run_check "Forge domain build" pnpm --filter @cyclewarden/forge-domain build
          run_check "Chromium installation" pnpm --filter @cyclewarden/web exec playwright install chromium --with-deps
          run_check "Cross-context Playwright" pnpm --filter @cyclewarden/web exec playwright test e2e/forge-live-controls.spec.ts --retries=0

          {
            echo "# Forge live-controls verification"
            echo
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
            echo "OVERALL_STATUS=${overall}"
            echo
            cat /tmp/forge-live-controls.log
          } > .github/forge-live-controls-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/forge-live-controls-result.txt
          git commit -m "Record Forge live-controls verification" || true
          git push
          exit "${overall}"

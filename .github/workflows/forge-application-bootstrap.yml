name: Forge application bootstrap

on:
  push:
    branches:
      - agent/atoryn-forge-application-fakes
    paths:
      - .github/workflows/forge-application-bootstrap.yml
  pull_request:
    branches:
      - agent/atoryn-forge-domain-foundation

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-application-fakes
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Synchronize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Validate Forge domain dependency
        run: |
          pnpm --filter @cyclewarden/forge-domain typecheck
          pnpm --filter @cyclewarden/forge-domain test
          pnpm --filter @cyclewarden/forge-domain build

      - name: Typecheck Forge application
        run: pnpm --filter @cyclewarden/forge-application typecheck

      - name: Test Forge application
        run: pnpm --filter @cyclewarden/forge-application test

      - name: Build Forge application
        run: pnpm --filter @cyclewarden/forge-application build

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "Sync Forge application workspace lockfile"
          git push origin HEAD:agent/atoryn-forge-application-fakes

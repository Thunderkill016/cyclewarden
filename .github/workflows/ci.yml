name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hubcode-pilot-smoke:
    name: Hubcode / Codex control-plane smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HUBCODE_HOME: /tmp/hubcode
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hubcode-pilot

      - name: Normalize Git branch metadata
        shell: bash
        run: |
          git remote set-head origin main
          git branch --show-current
          git remote show origin

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Hubcode and Codex CLIs
        run: npm install -g @hubcode/cli@2.8.4 @openai/codex

      - name: Record versions and authentication state
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "## Installed versions"
            echo
            echo '```text'
            node --version
            pnpm --version
            hubcode --version || true
            codex --version || true
            codex login status || true
            echo '```'
          } | tee artifacts/hubcode-smoke.md

      - name: Start Hubcode daemon
        shell: bash
        run: |
          set -o pipefail
          hubcode daemon start 2>&1 | tee -a artifacts/hubcode-smoke.md
          hubcode daemon status 2>&1 | tee -a artifacts/hubcode-smoke.md
          hubcode ls -a --json 2>&1 | tee -a artifacts/hubcode-smoke.md || true

      - name: Attempt read-only Codex verifier through Hubcode
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo >> artifacts/hubcode-smoke.md
          echo "## Hubcode verifier attempt" | tee -a artifacts/hubcode-smoke.md
          timeout 360s hubcode run \
            --provider codex \
            --base agent/hubcode-pilot \
            --worktree hubcode-ci-smoke \
            "Read AGENTS.md, GitHub issue #68, and docs/practical/HUBCODE_PILOT.md. Do not edit files. Verify that hubcode.json is valid, that the documented responsibility split is internally consistent, and that this repository remains human-merge-only. Report accept, reject, or blocked with evidence." \
            2>&1 | tee -a artifacts/hubcode-smoke.md
          code=${PIPESTATUS[0]}
          echo >> artifacts/hubcode-smoke.md
          echo "Hubcode run exit code: ${code}" | tee -a artifacts/hubcode-smoke.md
          exit "$code"

      - name: Capture agent and daemon diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          agent_id="$(hubcode ls -a -g --json | jq -r '.[0].id // empty')"
          {
            echo
            echo "## Agent diagnostics"
            echo
            echo "Agent ID: ${agent_id:-none}"
            if [ -n "$agent_id" ]; then
              echo '```text'
              hubcode logs "$agent_id" --tail 100 || true
              echo '```'
            fi
            echo
            echo "## Daemon log tail"
            echo
            echo '```text'
            tail -n 160 /tmp/hubcode/daemon.log || true
            echo '```'
            echo
            echo "## Final state"
            echo
            echo '```text'
            git worktree list || true
            hubcode ls -a -g --json || true
            hubcode daemon status || true
            echo '```'
          } | tee -a artifacts/hubcode-smoke.md

      - name: Upload Hubcode smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hubcode-smoke-report
          path: artifacts/hubcode-smoke.md
          if-no-files-found: error
          retention-days: 7

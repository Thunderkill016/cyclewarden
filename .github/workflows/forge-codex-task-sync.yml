name: Forge Codex task sync

on:
  push:
    branches:
      - agent/atoryn-forge-codex-provider
    paths:
      - .github/workflows/forge-codex-task-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-codex-provider
      - name: Mark T076 complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/001-remote-agent-run/tasks.md")
          text = path.read_text()
          before = "- [ ] T076 Create `packages/provider-codex/` implementing start, resume, additional instruction, approval, cancel, event stream, and usage summary"
          after = "- [x] T076 Create `packages/provider-codex/` implementing start, resume, additional instruction, approval, cancel, event stream, and usage summary"
          if before not in text:
              raise SystemExit("T076 task line was not found")
          path.write_text(text.replace(before, after, 1))
          PY
      - name: Commit task ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add specs/001-remote-agent-run/tasks.md
          git commit -m "docs(forge): mark Codex provider complete"
          git push origin HEAD:agent/atoryn-forge-codex-provider

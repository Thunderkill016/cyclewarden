name: Forge live provider bootstrap

on:
  push:
    branches:
      - agent/atoryn-forge-live-provider-spike
    paths:
      - packages/provider-github/**
      - .github/workflows/forge-live-provider-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: forge-live-provider-bootstrap
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-live-provider-spike
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Synchronize workspace lockfile
        run: pnpm install --lockfile-only
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore(forge): sync GitHub provider lockfile"
          git push origin HEAD:agent/atoryn-forge-live-provider-spike
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
      - name: Typecheck GitHub provider
        run: pnpm --filter @cyclewarden/provider-github typecheck
      - name: Test GitHub provider
        run: pnpm --filter @cyclewarden/provider-github test
      - name: Build GitHub provider
        run: pnpm --filter @cyclewarden/provider-github build

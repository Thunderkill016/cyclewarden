name: Forge final verification

on:
  push:
    branches:
      - agent/atoryn-forge-final-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-final-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build
        run: pnpm build

name: Forge live event task sync

on:
  push:
    branches:
      - agent/atoryn-forge-live-event-normalization
    paths:
      - .github/workflows/forge-event-task-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-live-event-normalization
      - name: Mark T077 complete
        run: python -c 'from pathlib import Path; p=Path("specs/001-remote-agent-run/tasks.md"); s=p.read_text(); old="- [ ] T077 Normalize live provider events into versioned Atoryn run events"; assert old in s; p.write_text(s.replace(old, old.replace("[ ]", "[x]"), 1))'
      - name: Commit task ledger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add specs/001-remote-agent-run/tasks.md
          git commit -m "docs(forge): mark live provider event normalization complete"
          git push origin HEAD:agent/atoryn-forge-live-event-normalization

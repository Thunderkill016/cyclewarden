name: Forge live evidence once

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: forge-live-evidence-once
  cancel-in-progress: false

jobs:
  github-contract:
    if: ${{ contains(github.event.head_commit.message, '[run-live-evidence]') }}
    runs-on: ubuntu-latest
    environment: live-github-contract
    timeout-minutes: 15
    env:
      API_VERSION: "2022-11-28"
      OWNER: Thunderkill016
      TOKEN: ${{ secrets.ATORYN_LIVE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Prepare evidence
        run: mkdir -p artifacts
      - name: Validate protected token
        run: test -n "$TOKEN"
      - name: Create disposable repository
        id: disposable
        shell: bash
        run: |
          set -euo pipefail
          name="atoryn-disposable-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          full="$OWNER/$name"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST https://api.github.com/user/repos \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            -d "$(jq -cn --arg name "$name" '{name:$name,private:true,auto_init:true,description:"Disposable Atoryn Forge live contract fixture"}')")"
          test "$(jq -r .full_name <<<"$response")" = "$full"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "base_branch=$(jq -r .default_branch <<<"$response")" >> "$GITHUB_OUTPUT"
          jq '{repository:.full_name,repositoryId:.id,private:.private,defaultBranch:.default_branch,createdAt:.created_at}' <<<"$response" > artifacts/forge-live-github-contract.json
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Forge domain
        run: pnpm --filter @cyclewarden/forge-domain build
      - name: Capture base before contract
        id: base_before
        shell: bash
        env:
          REPOSITORY: ${{ steps.disposable.outputs.full }}
          BASE_BRANCH: ${{ steps.disposable.outputs.base_branch }}
        run: |
          set -euo pipefail
          sha="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/$BASE_BRANCH" | jq -r .object.sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Run disposable-repository contract
        env:
          ATORYN_LIVE_GITHUB_CONTRACT: "1"
          ATORYN_LIVE_GITHUB_TOKEN: ${{ secrets.ATORYN_LIVE_GITHUB_TOKEN }}
          ATORYN_LIVE_GITHUB_REPOSITORY: ${{ steps.disposable.outputs.full }}
          ATORYN_LIVE_GITHUB_CONFIRM_DISPOSABLE: DESTROY:${{ steps.disposable.outputs.full }}
          ATORYN_LIVE_GITHUB_BASE_BRANCH: ${{ steps.disposable.outputs.base_branch }}
        run: pnpm --filter @cyclewarden/provider-github test:live
      - name: Collect contract evidence
        if: always() && steps.disposable.outputs.full != ''
        shell: bash
        env:
          REPOSITORY: ${{ steps.disposable.outputs.full }}
          BASE_BRANCH: ${{ steps.disposable.outputs.base_branch }}
          BASE_BEFORE: ${{ steps.base_before.outputs.sha }}
        run: |
          set -euo pipefail
          pulls="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "https://api.github.com/repos/$REPOSITORY/pulls?state=closed&per_page=10")"
          pull="$(jq '[.[] | select(.title | startswith("Atoryn Forge live contract"))][0] // {}' <<<"$pulls")"
          base_after="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/$BASE_BRANCH" | jq -r .object.sha)"
          branch="$(jq -r '.head.ref // empty' <<<"$pull")"
          branch_status="not-recorded"
          if [ -n "$branch" ]; then
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/$branch")"
            branch_status="$code"
          fi
          jq --arg repository "$REPOSITORY" \
             --arg baseBranch "$BASE_BRANCH" \
             --arg baseBefore "$BASE_BEFORE" \
             --arg baseAfter "$base_after" \
             --arg branchStatus "$branch_status" \
             --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
             --arg commit "$GITHUB_SHA" \
             --argjson pull "$pull" \
             '. + {status:"passed",workflowRunUrl:$runUrl,workflowRunId:env.GITHUB_RUN_ID,commitSha:$commit,baseBranch:$baseBranch,baseShaBefore:$baseBefore,baseShaAfter:$baseAfter,baseUnchanged:($baseBefore==$baseAfter),pullRequest:{number:($pull.number // null),url:($pull.html_url // null),state:($pull.state // null),draft:($pull.draft // null),headRef:($pull.head.ref // null),headSha:($pull.head.sha // null)},workingBranchLookupHttpStatus:$branchStatus,productionRepositoryTargeted:false}' \
             artifacts/forge-live-github-contract.json > artifacts/forge-live-github-contract.tmp
          mv artifacts/forge-live-github-contract.tmp artifacts/forge-live-github-contract.json
          test "$BASE_BEFORE" = "$base_after"
          test "$(jq -r '.number // empty' <<<"$pull")" != ""
          test "$branch_status" = "404"
      - name: Delete disposable repository
        if: always() && steps.disposable.outputs.full != ''
        shell: bash
        env:
          REPOSITORY: ${{ steps.disposable.outputs.full }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: $API_VERSION" \
            "https://api.github.com/repos/$REPOSITORY")"
          jq --arg code "$code" '. + {repositoryCleanup:{attempted:true,httpStatus:$code,success:($code=="204")}}' \
            artifacts/forge-live-github-contract.json > artifacts/forge-live-github-contract.tmp
          mv artifacts/forge-live-github-contract.tmp artifacts/forge-live-github-contract.json
          test "$code" = "204"
      - name: Upload GitHub contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-live-github-contract
          path: artifacts/forge-live-github-contract.json
          if-no-files-found: error
          retention-days: 30

  sandbox-codex-smoke:
    if: ${{ contains(github.event.head_commit.message, '[run-live-evidence]') }}
    runs-on: ubuntu-latest
    environment: live-sandbox-codex
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare evidence
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq -n \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg commit "$GITHUB_SHA" \
            --argjson openai "$([ -n "$OPENAI_API_KEY" ] && echo true || echo false)" \
            --argjson token "$([ -n "$VERCEL_TOKEN" ] && echo true || echo false)" \
            --argjson team "$([ -n "$VERCEL_TEAM_ID" ] && echo true || echo false)" \
            --argjson project "$([ -n "$VERCEL_PROJECT_ID" ] && echo true || echo false)" \
            '{status:"preflight",workflowRunUrl:$runUrl,workflowRunId:env.GITHUB_RUN_ID,commitSha:$commit,secretsPresent:{openaiApiKey:$openai,vercelToken:$token,vercelTeamId:$team,vercelProjectId:$project}}' \
            > artifacts/forge-live-sandbox-codex-preflight.json
          test "$openai" != "" 2>/dev/null || true
          test -n "$OPENAI_API_KEY"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_TEAM_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Install current Vercel Sandbox SDK without changing repository state
        run: npm install --no-save --package-lock=false @vercel/sandbox@latest
      - name: Run deterministic live smoke
        env:
          ATORYN_LIVE_SANDBOX_CODEX_SMOKE: "1"
          ATORYN_LIVE_SANDBOX_CODEX_CONFIRM: RUN:LIVE-SANDBOX-CODEX
          ATORYN_LIVE_CODEX_VERSION: "0.146.0"
          ATORYN_LIVE_SMOKE_REPORT_PATH: artifacts/forge-live-sandbox-codex-smoke.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/forge-live-sandbox-codex-smoke.mjs
      - name: Upload sandbox Codex evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-live-sandbox-codex-smoke
          path: artifacts/forge-live-sandbox-codex-*.json
          if-no-files-found: error
          retention-days: 30

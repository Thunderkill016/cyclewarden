name: Forge task tail diagnostic

on:
  push:
    branches:
      - agent/atoryn-forge-final-hardening

permissions:
  contents: write

jobs:
  tail:
    if: ${{ !contains(github.event.head_commit.message, '[tail-dump]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-final-hardening
      - name: Commit final task ledger tail
        run: |
          set -euo pipefail
          tail -n 45 specs/001-remote-agent-run/tasks.md > specs/001-remote-agent-run/task-tail.tmp
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add specs/001-remote-agent-run/task-tail.tmp
          git commit -m "chore: expose final task tail [tail-dump]"
          git push origin HEAD:agent/atoryn-forge-final-hardening

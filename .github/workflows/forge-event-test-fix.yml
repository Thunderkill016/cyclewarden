name: Forge provider event test correction

on:
  push:
    branches:
      - agent/atoryn-forge-live-event-normalization
    paths:
      - .github/workflows/forge-event-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-live-event-normalization
      - name: Correct thrown-error assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/forge-application/src/events/live-provider-event-normalizer.test.ts")
          text = path.read_text()
          before = ''')
    ).toMatchObject<Partial<LiveProviderEventNormalizationError>>({
      code: "NON_JSON_PAYLOAD",
    });
'''
          after = ''')
    ).toThrowError(LiveProviderEventNormalizationError);
'''
          if before not in text:
              raise SystemExit("Expected cyclic-payload assertion was not found")
          path.write_text(text.replace(before, after, 1))
          PY
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/forge-application/src/events/live-provider-event-normalizer.test.ts
          git commit -m "test(forge): assert cyclic provider payload rejection"
          git push origin HEAD:agent/atoryn-forge-live-event-normalization

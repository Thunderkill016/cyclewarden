name: Sync Spec Kit for Atoryn Forge

on:
  workflow_dispatch:
  push:
    branches:
      - agent/atoryn-forge-spec-foundation
    paths:
      - .github/workflows/sync-spec-kit.yml

permissions:
  contents: write

concurrency:
  group: sync-spec-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Generate official Codex skills and Spec Kit assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve Atoryn-authored artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atoryn-spec-backup
          cp .specify/memory/constitution.md /tmp/atoryn-spec-backup/constitution.md
          cp .specify/feature.json /tmp/atoryn-spec-backup/feature.json
          tar -czf /tmp/atoryn-spec-backup/specs.tgz specs

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade uv
          uv --version

      - name: Initialize Spec Kit with the official Codex integration
        shell: bash
        run: |
          set -euo pipefail
          uvx --from git+https://github.com/github/spec-kit.git@v0.8.15 \
            specify init --here --force \
            --integration codex \
            --integration-options="--skills" \
            --ignore-agent-tools \
            --script sh
          uvx --from git+https://github.com/github/spec-kit.git@v0.8.15 \
            specify version

      - name: Restore Atoryn-authored artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/atoryn-spec-backup/constitution.md .specify/memory/constitution.md
          cp /tmp/atoryn-spec-backup/feature.json .specify/feature.json
          rm -rf specs
          tar -xzf /tmp/atoryn-spec-backup/specs.tgz

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail
          required_skills=(
            speckit-analyze
            speckit-checklist
            speckit-clarify
            speckit-constitution
            speckit-converge
            speckit-implement
            speckit-plan
            speckit-specify
            speckit-tasks
            speckit-taskstoissues
          )
          for skill in "${required_skills[@]}"; do
            test -s ".agents/skills/${skill}/SKILL.md"
          done
          test -s .specify/templates/spec-template.md
          test -s .specify/templates/plan-template.md
          test -s .specify/templates/tasks-template.md
          test -s .specify/templates/checklist-template.md
          test -s .specify/scripts/bash/common.sh
          test -s .specify/scripts/bash/check-prerequisites.sh
          test -s .specify/memory/constitution.md
          test -s specs/001-remote-agent-run/spec.md

      - name: Commit generated Spec Kit files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents .specify
          if git diff --cached --quiet; then
            echo "Spec Kit assets are already synchronized."
            exit 0
          fi
          git commit -m "Sync official Spec Kit Codex assets"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Forge final task sync

on:
  push:
    branches:
      - agent/atoryn-forge-final-hardening

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[final-task-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-final-hardening
      - name: Mark deterministic Phase 10 tasks complete
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('specs/001-remote-agent-run/tasks.md')
          text = path.read_text()
          for number in range(81, 91):
              pending = f'- [ ] T{number:03d}'
              complete = f'- [X] T{number:03d}'
              if pending not in text and complete not in text:
                  raise SystemExit(f'Missing T{number:03d}')
              text = text.replace(pending, complete)
          for number in (78, 79, 80):
              if f'- [ ] T{number:03d}' not in text:
                  raise SystemExit(f'T{number:03d} must remain evidence-gated')
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add specs/001-remote-agent-run/tasks.md
          git commit -m "docs: complete deterministic Forge hardening tasks [final-task-sync]"
          git push origin HEAD:agent/atoryn-forge-final-hardening

name: AI workflow check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "AI_WORKFLOW.md"
      - "PROJECT_OS_SCOPE.md"
      - "PRACTICAL_SCOPE.md"
      - "README.md"
      - "ROADMAP.md"
      - "docs/CAPABILITIES.json"
      - "docs/ai/**"
      - "docs/project-os/**"
      - "docs/research/**"
      - "docs/evolution/EXTERNAL_SYSTEMS.json"
      - "docs/evolution/pilot/**"
      - "fixtures/project-os/**"
      - "prompts/**"
      - ".agents/**"
      - ".github/**"
      - "scripts/check-ai-workflow.mjs"
      - "scripts/check-capabilities.mjs"
      - "scripts/test-capabilities.mjs"
      - "scripts/check-external-systems.mjs"
      - "scripts/external-systems-validation.mjs"
      - "scripts/test-external-systems.mjs"
      - "scripts/a2-pilot-validation.mjs"
      - "scripts/check-a2-pilot.mjs"
      - "scripts/test-a2-pilot.mjs"
      - "scripts/cw.mjs"
      - "scripts/cw*.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate capability registry
        run: node scripts/check-capabilities.mjs
      - name: Validate active workflow contract
        id: workflow-contract
        continue-on-error: true
        run: node scripts/check-ai-workflow.mjs > workflow-check.log 2>&1
      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-check-diagnostics
          path: workflow-check.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when workflow contract is invalid
        if: steps.workflow-contract.outcome == 'failure'
        run: |
          cat workflow-check.log
          exit 1
      - name: Test Project OS CLI and MoneyFlow pilot
        run: node --test scripts/cw.test.mjs scripts/cw.moneyflow.test.mjs
      - run: node scripts/test-capabilities.mjs
      - run: node scripts/check-external-systems.mjs
      - run: node scripts/test-external-systems.mjs
      - run: node scripts/check-a2-pilot.mjs
      - run: node scripts/test-a2-pilot.mjs

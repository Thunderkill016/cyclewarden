name: Finalize Spec Kit sync

on:
  push:
    branches:
      - agent/atoryn-forge-spec-foundation
    paths:
      - .github/workflows/finalize-spec-kit-sync.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-spec-kit-sync.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/atoryn-forge-spec-foundation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-spec-foundation
          fetch-depth: 0

      - name: Align artifacts with released Spec Kit and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('specs/001-remote-agent-run/tasks.md'): [
                  (
                      '- [ ] T006 Run the official Spec Kit CLI locally with Codex skills and reconcile generated templates without overwriting committed artifacts',
                      '- [x] T006 Run official Spec Kit CLI v0.8.15 on a GitHub-hosted Linux runner and synchronize Codex skills, templates, scripts, manifests, and extensions while preserving Atoryn-authored artifacts',
                  ),
                  (
                      '## Phase 10: Security, responsive hardening, and convergence',
                      '## Phase 10: Security, responsive hardening, and final verification',
                  ),
                  (
                      '- [ ] T089 Run `$speckit-converge` and append any missing implementation or evidence tasks',
                      '- [ ] T089 Perform a final specification-to-implementation evidence review and append any missing implementation or evidence tasks',
                  ),
                  (
                      'Security/convergence requires every implemented story and live-provider result.',
                      'Security/final verification requires every implemented story and live-provider result.',
                  ),
              ],
              Path('specs/001-remote-agent-run/quickstart.md'): [
                  ('$speckit-converge\n', ''),
                  (
                      '- the implementation converges against `spec.md`, `plan.md`, and `tasks.md`;',
                      '- the implementation has been reviewed against `spec.md`, `plan.md`, and `tasks.md`;',
                  ),
              ],
              Path('specs/001-remote-agent-run/plan.md'): [
                  (
                      '8. Convergence against specification.',
                      '8. Final evidence review against the specification.',
                  ),
              ],
              Path('.specify/memory/constitution.md'): [
                  (
                      '- Pending template propagation: Spec Kit templates will be installed or refreshed when the official CLI is run locally.',
                      '- Template propagation: official Spec Kit v0.8.15 Codex skills, templates, scripts, manifests, bundled workflow, and Git extension synchronized on 2026-08-04.',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/workflows/finalize-spec-kit-sync.yml

      - name: Commit finalized Spec Kit foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml specs .specify/memory/constitution.md .github/workflows/finalize-spec-kit-sync.yml
          git commit -m "Finalize Spec Kit foundation"
          git push origin HEAD:agent/atoryn-forge-spec-foundation

name: Forge targeted verification

on:
  push:
    branches:
      - agent/atoryn-forge-start-flow
    paths:
      - .github/workflows/forge-start-flow-bootstrap.yml
      - apps/web/package.json
      - apps/web/src/components/forge/**
      - apps/web/vitest.config.ts

permissions:
  contents: write

jobs:
  failing-component-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-start-flow
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Sync only the changed workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Run only the previously failing component test
        run: >-
          pnpm --filter @cyclewarden/web exec vitest run
          src/components/forge/start-components.test.tsx

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync Forge web workspace lockfile"
          git push origin HEAD:agent/atoryn-forge-start-flow

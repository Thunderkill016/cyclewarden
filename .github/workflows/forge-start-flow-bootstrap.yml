name: Forge targeted verification

on:
  push:
    branches:
      - agent/atoryn-forge-start-flow
    paths:
      - .github/workflows/forge-start-flow-bootstrap.yml
  pull_request:
    branches:
      - agent/atoryn-forge-persistence

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-start-flow
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Synchronize only the workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit synchronized lockfile safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "Sync Forge web workspace lockfile"
          git fetch origin agent/atoryn-forge-start-flow
          git rebase origin/agent/atoryn-forge-start-flow
          git push origin HEAD:agent/atoryn-forge-start-flow

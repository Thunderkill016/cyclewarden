name: Forge targeted verification

on:
  push:
    branches:
      - agent/atoryn-forge-start-flow
    paths:
      - .github/workflows/forge-start-flow-bootstrap.yml
      - apps/web/src/components/forge/**
      - apps/web/vitest.config.ts
  pull_request:
    branches:
      - agent/atoryn-forge-persistence

permissions:
  contents: read
  pull-requests: read

jobs:
  failing-component-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-start-flow

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install from validated lockfile
        run: pnpm install --frozen-lockfile

      - name: Run only the previously failing component test
        run: >-
          pnpm --filter @cyclewarden/web exec vitest run
          src/components/forge/start-components.test.tsx

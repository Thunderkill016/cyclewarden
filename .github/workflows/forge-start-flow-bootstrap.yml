name: Forge targeted verification

on:
  push:
    branches:
      - agent/atoryn-forge-start-flow
    paths:
      - .github/workflows/forge-start-flow-bootstrap.yml
  pull_request:
    branches:
      - agent/atoryn-forge-persistence

permissions:
  contents: read
  pull-requests: read

jobs:
  locate-profile-query:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-start-flow

      - name: Locate UUID profile lookups
        shell: bash
        run: >-
          git grep -n -E
          'profiles|displayName|display_name|avatarUrl|avatar_url'
          -- apps/web packages

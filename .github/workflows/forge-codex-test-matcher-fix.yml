name: Forge Codex matcher fix

on:
  push:
    branches:
      - agent/atoryn-forge-final-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[codex-matcher-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoryn-forge-final-hardening
      - name: Remove obsolete matcher type arguments
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/provider-codex/src/codex-provider.test.ts')
          text = path.read_text()
          text = text.replace('.toMatchObject<Partial<CodexProviderError>>(', '.toMatchObject(')
          text = text.replace('.toMatchObject<\n      Partial<CodexProviderError>\n    >(', '.toMatchObject(')
          path.write_text(text)
          PY
          test "$(grep -c 'toMatchObject<' packages/provider-codex/src/codex-provider.test.ts || true)" = "0"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/provider-codex/src/codex-provider.test.ts
          git commit -m "test: remove obsolete Vitest matcher generics [codex-matcher-fix]"
          git push origin HEAD:agent/atoryn-forge-final-hardening
